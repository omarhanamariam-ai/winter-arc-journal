<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="60%" stop-color="#080d16" />
      <stop offset="100%" stop-color="#05070b" />
    </radialGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#cyan-glow)" stroke-width="6" opacity="0.4" />

  <!-- Snowflake / Winter Arc Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- 6 Primary Axes -->
    <g stroke="#e0f2fe" stroke-width="12" stroke-linecap="round">
      <line y1="-165" y2="165" />
      <line y1="-165" y2="165" transform="rotate(60)" />
      <line y1="-165" y2="165" transform="rotate(120)" />
    </g>

    <!-- Chevron Branches on Axes -->
    <g stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none">
      <!-- 0 deg -->
      <path d="M -30 -105 L 0 -135 L 30 -105" />
      <path d="M -24 -55 L 0 -80 L 24 -55" />
      <!-- 180 deg -->
      <path d="M -30 105 L 0 135 L 30 105" />
      <path d="M -24 55 L 0 80 L 24 55" />
      <!-- 60 deg -->
      <path d="M -30 -105 L 0 -135 L 30 -105" transform="rotate(60)" />
      <path d="M -24 -55 L 0 -80 L 24 -55" transform="rotate(60)" />
      <!-- 240 deg -->
      <path d="M -30 105 L 0 135 L 30 105" transform="rotate(60)" />
      <path d="M -24 55 L 0 80 L 24 55" transform="rotate(60)" />
      <!-- 120 deg -->
      <path d="M -30 -105 L 0 -135 L 30 -105" transform="rotate(120)" />
      <path d="M -24 -55 L 0 -80 L 24 -55" transform="rotate(120)" />
      <!-- 300 deg -->
      <path d="M -30 105 L 0 135 L 30 105" transform="rotate(120)" />
      <path d="M -24 55 L 0 80 L 24 55" transform="rotate(120)" />
    </g>

    <!-- Center Ring & Core Diamond -->
    <circle r="42" fill="none" stroke="#38bdf8" stroke-width="7" />
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#ffffff" />
  </g>
</svg>
